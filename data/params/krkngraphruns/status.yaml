  description: 'Calculated is the aggregated resiliency score for this cluster (0-100). This is calculated by averaging the scores from all nodes that ran on this cluster. Sentinel convention: -1 means score calculation is in progress (Status will be "calculating"). The controller sets this on GraphRun creation when ResiliencyScoreEnabled is true, then replaces it with the real score (&gt;= 0) once the run reaches a terminal phase. Frontend interpretation: -1 → "Calculating...", &gt;= 0 → display value, absent → N/A.'
