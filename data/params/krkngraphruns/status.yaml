  description: 'ResiliencyScores tracks per-cluster resiliency scores throughout the GraphRun lifecycle. One entry per target cluster. The array goes through two phases: 1. Sentinel phase (on creation, when Spec.ResiliencyScoreEnabled is true): Each entry has Calculated == -1 and Status == "calculating". This lets the frontend show "Calculating..." immediately. 2. Final phase (on terminal state: Completed, Failed, or PartiallyFailed): The controller replaces sentinel entries with real scores (Calculated &gt;= 0). Status becomes "pass", "fail", "no-baseline", or "error". Once set to real values, scores are IMMUTABLE to preserve historical accuracy. Frontend interpretation: - absent/empty → resiliency scoring not enabled (show N/A) - Calculated == -1 → score calculation in progress (show "Calculating...") - Calculated &gt;= 0 → real score (display value)'
  type: array
