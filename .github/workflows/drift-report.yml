name: Docs drift report

# Weekly, report-only scan of parameter drift for the krkn-hub and krknctl sources.
# Posts or updates one rolling docs-drift issue with a checklist per scenario, each
# finding linking the exact file and a suggested fix. Opens no PRs. Fixing is done
# by commenting /fix <scenario> on the issue, which drives the Doc Sync workflow.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout krkn-hub (per-scenario and global env.sh)
        uses: actions/checkout@v4
        with:
          repository: StrikerEureka34/krkn-hub
          path: krkn-hub

      # Global krknctl params live in krkn, not krkn-hub. Without this the bot
      # refuses to run rather than silently emitting a degraded skip list.
      - name: Checkout krkn (global krknctl params)
        uses: actions/checkout@v4
        with:
          repository: StrikerEureka34/krkn
          path: krkn

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs bot
        run: pip install "git+https://github.com/StrikerEureka34/krkn-docs-bot-gh-aw.git@main"

      # Post the issue as the krkn-docs-bot app, not github-actions[bot].
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Scan and post the docs-drift issue
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python -m bot.drift_scanner \
            --krkn-hub krkn-hub \
            --krkn krkn \
            --website . \
            --repo "${{ github.repository }}" \
            --hub-url https://github.com/StrikerEureka34/krkn-hub/blob/main
